<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projetos</title>
<!--
  PÁGINA PROVISÓRIA.
  É esta página que o "Projetos.exe" (o navegador do BRENNO//OS) abre.
  Substitua este arquivo pela sua página de projetos — o navegador carrega
  desktop-os/projetos/index.html (dá pra mudar em PROJECTS_PAGE, no index.html do desktop).
-->
<style>
  body{ margin:0; padding:28px 20px; font-family:'Times New Roman',serif; color:#000;
    background:#fff repeating-linear-gradient(45deg, #fff 0 12px, #f4ecff 12px 24px); text-align:center; }
  h1{ font-family:'Arial Black',Impact,sans-serif; font-style:italic; font-size:34px; margin:0 0 6px;
    color:#ff2e97; text-shadow:2px 2px 0 #00e5ff; }
  .tape{ display:inline-block; margin:14px 0; padding:6px 16px; font:bold 15px 'Courier New',monospace; color:#000;
    background:repeating-linear-gradient(135deg, #ffe600 0 14px, #111 14px 28px); }
  .tape span{ background:#ffe600; padding:2px 8px; }
  hr{ border:0; height:3px; background:linear-gradient(90deg,#ff6ad5,#9d4edd,#00e5ff); margin:18px auto; max-width:520px; }
  p{ font-size:17px; }
  a{ color:#0000ee; }
  .blink{ animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>
<body>
  <h1>Meus Projetos</h1>
  <div class="tape"><span>PÁGINA EM CONSTRUÇÃO</span></div>
  <hr>
  <p>Em breve, aqui vai ficar tudo sobre os meus projetos.</p>
  <p class="blink">Volte logo!</p>
  <hr>
  <p style="font-size:13px">Melhor visualizado em 800x600 &middot; <a href="#topo" onclick="return false">voltar ao topo</a></p>
  <script src="../click-sound.js"></script>
</body>
</html>
