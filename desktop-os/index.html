<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-en="BRENNO//OS — Portfolio (spike)">BRENNO//OS — Portfólio (spike)</title>
<!-- cursor pixelado, compartilhado com as páginas do Projetos.exe -->
<link rel="stylesheet" href="cursor.css" />
<style>
  :root{
    --pink:#ff6ad5;
    --cyan:#00e5ff;
    --purple:#9d4edd;
    --deep:#1a0b2e;
    --deep2:#2d1b4e;
    --orange:#ff9e7d;
    --yellow:#ffe66d;
    --win:#c3c7cb;
    --win-dark:#868a8e;
    --win-light:#ffffff;
    --title1:#4b1fa0;
    --title2:#c02fb0;
    --scan: rgba(0,0,0,.12);
    --mono: 'Lucida Console','Courier New',ui-monospace,monospace;
    --pixel: 'Lucida Console','Courier New',monospace;
    --display: 'Arial Black','Impact',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    font-family:var(--mono);
    background:#000; color:#111;
    user-select:none; -webkit-user-select:none;
  }

  /* ===== BACKGROUND ===== */
  #bg{ position:fixed; inset:0; z-index:0; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 42%, #ff8fd9 0%, #b14fd8 28%, #5b2a9e 52%, var(--deep) 82%); }
  /* sol no centro da área visível (desconta a barra de tarefas) e com tamanho proporcional à tela */
  #sun{ position:absolute; left:50%; top:calc(50% - 19px); translate:-50% -50%; width:clamp(240px,38vmin,460px); aspect-ratio:1; border-radius:50%;
    background:linear-gradient(#fff3b0, #ffcc70 38%, #ff7bbf 70%, #ff4fa3); box-shadow:0 0 90px 20px rgba(255,120,190,.55); overflow:hidden; }
  #sun::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:62%;
    background:repeating-linear-gradient(to bottom, transparent 0 10px, var(--deep) 10px 20px); opacity:.9; }
  #grid{ position:absolute; left:-20%; right:-20%; bottom:-5%; height:52%;
    background-image:linear-gradient(var(--cyan) 1px, transparent 1px), linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
    background-size:60px 60px; transform:perspective(380px) rotateX(70deg); transform-origin:bottom center; opacity:.5;
    animation:flow 2.4s linear infinite; }
  @keyframes flow{ from{ background-position:0 0; } to{ background-position:0 60px; } }
  #mtns{ position:absolute; left:0; right:0; bottom:46%; height:12%; opacity:.5;
    background:linear-gradient(135deg, transparent 49.6%, rgba(0,229,255,.35) 49.6% 50.4%, transparent 50.4%) 0 0/70px 70px,
               linear-gradient(45deg, transparent 49.6%, rgba(255,106,213,.35) 49.6% 50.4%, transparent 50.4%) 0 0/70px 70px; }
  .cloud{ position:absolute; color:#fff; opacity:.7; animation:drift linear infinite; text-shadow:2px 2px 0 rgba(0,0,0,.1); }
  @keyframes drift{ from{ transform:translateX(-12vw);} to{ transform:translateX(112vw);} }

  /* ===== CRT ===== */
  #crt{ position:fixed; inset:0; z-index:9999; pointer-events:none;
    background:repeating-linear-gradient(to bottom, transparent 0 2px, var(--scan) 2px 4px); mix-blend-mode:multiply; opacity:.5; }
  #crt::after{ content:""; position:absolute; inset:0; background:radial-gradient(130% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%); }

  /* ===== BOOT (tela de inicialização estilo fim dos anos 90) ===== */
  #boot{ position:fixed; inset:0; z-index:10000; overflow:hidden; background:#000; color:#fff;
    font-family:Arial,Helvetica,sans-serif; transition:opacity .4s; }
  #boot.off{ opacity:0; pointer-events:none; }

  /* 1) monitor ligando: linha branca que abre e vira um flash */
  #boot .flash{ position:absolute; inset:0; background:#fff; opacity:0; transform:scale(0,.004); }
  #boot.power .flash{ animation:crtOn .5s ease-out forwards; }
  @keyframes crtOn{
    0%  { opacity:1; transform:scale(0,.004); }
    35% { opacity:1; transform:scale(1,.004); }
    65% { opacity:.85; transform:scale(1,1); }
    100%{ opacity:0; transform:scale(1,1); }
  }

  /* 2) splash: céu, nuvens, logo e barra animada */
  #boot .splash{ position:absolute; inset:0; opacity:0; transition:opacity .4s;
    background:linear-gradient(180deg,#123c8f 0%,#2f6dd0 40%,#78aaea 75%,#b9d6f6 100%); }
  #boot.on .splash{ opacity:1; }
  #boot .bcloud{ position:absolute; border-radius:50%; filter:blur(10px);
    background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.55) 55%, transparent);
    animation:bdrift 30s linear infinite; }
  @keyframes bdrift{ from{ transform:translateX(-6vw); } to{ transform:translateX(6vw); } }

  #boot .logo{ position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) scale(.92);
    display:flex; align-items:center; gap:clamp(14px,3vw,30px); opacity:0;
    transition:opacity .5s .1s, transform .9s .1s cubic-bezier(.2,.8,.2,1); }
  #boot.on .logo{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* computador anos 90 (SVG inline) ao lado do logo */
  #boot .pc{ flex:0 0 auto; display:block; width:clamp(130px,19vw,230px); height:auto; overflow:visible;
    filter:drop-shadow(4px 6px 0 rgba(0,0,0,.22)); }
  /* LEDs do HD e do disquete piscando enquanto "carrega" */
  #boot .pc-hdd{ animation:pcled 1.4s steps(1) infinite; }
  #boot .pc-fdd{ animation:pcled 2.3s steps(1) infinite .5s; }
  @keyframes pcled{ 0%{opacity:1;} 18%{opacity:.2;} 30%{opacity:1;} 52%{opacity:.2;} 60%{opacity:1;} 85%{opacity:.2;} }

  #boot .word{ text-shadow:3px 3px 0 rgba(0,0,0,.28); line-height:1; }
  #boot .word .maker{ font-size:clamp(12px,1.6vw,17px); letter-spacing:.12em; opacity:.92; margin:0 0 6px 4px; }
  #boot .word .name{ font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:clamp(34px,6.4vw,74px); letter-spacing:-.01em; white-space:nowrap; }
  #boot .word .name i{ font-style:italic; font-weight:700; color:#dfeaff; padding-right:.1em; }

  #boot .foot-l, #boot .foot-r{ position:absolute; bottom:24px; font-size:13px; opacity:.85; text-shadow:1px 1px 0 rgba(0,0,0,.35); }
  #boot .foot-l{ left:18px; } #boot .foot-r{ right:18px; }
  #boot .foot-r::after{ content:""; display:inline-block; width:1.5em; text-align:left; animation:bdots 1.6s steps(1) infinite; }
  @keyframes bdots{ 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";} }

  /* barra "correndo" no rodapé, como nos splashes antigos */
  #boot .band{ position:absolute; left:0; right:0; bottom:0; height:12px;
    background:linear-gradient(90deg,#0b1a5e,#2f6dd0,#9fe3ff,#ff6ad5,#9d4edd,#2f6dd0,#0b1a5e);
    background-size:640px 100%; animation:bband 1.6s linear infinite; }
  @keyframes bband{ from{ background-position:0 0; } to{ background-position:640px 0; } }

  @media (max-width:600px){
    #boot .logo{ flex-direction:column; text-align:center; gap:16px; }
    #boot .word .maker{ margin-left:0; }
    #boot .word .name{ font-size:clamp(28px,10vw,44px); }
    #boot .foot-l, #boot .foot-r{ left:0; right:0; text-align:center; font-size:12px; }
    #boot .foot-l{ bottom:20px; } #boot .foot-r{ bottom:40px; }
  }
  @media (prefers-reduced-motion: reduce){
    #boot .bcloud, #boot .band, #boot .foot-r::after, #boot .pc-hdd, #boot .pc-fdd{ animation:none; }
    #boot.power .flash{ animation:none; }
  }

  /* ===== DESKTOP ===== */
  #desktop{ position:fixed; inset:0; z-index:1; }
  /* ícones moram numa grade invisível: arrasta livre, e ao soltar encaixa na célula (igual "alinhar à grade" do Windows) */
  .icons{ position:absolute; inset:0; pointer-events:none; }
  .icon{ position:absolute; width:108px; text-align:center; pointer-events:auto; touch-action:none; transition:left .12s ease-out, top .12s ease-out; }
  .icon.moving{ opacity:.75; z-index:2; transition:none; }
  /* contorno da célula onde o ícone vai cair */
  .icon-slot{ position:absolute; width:108px; height:84px; border:1px dotted rgba(255,255,255,.85); background:rgba(0,229,255,.12); display:none; }
  .icon-slot.on{ display:block; }
  .icon .glyph{ font-size:44px; line-height:1; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35)); }
  .icon .label{ margin-top:3px; color:#fff; font-size:15px; letter-spacing:.4px;
    text-shadow:1px 1px 0 #000, 0 0 6px rgba(0,229,255,.6); padding:1px 4px; display:inline-block; }
  .icon.sel .label{ background:#0a1fa0; outline:1px dotted #fff; }

  /* ===== WINDOWS ===== */
  .window{ position:absolute; min-width:240px; background:var(--win); border:2px solid #000;
    box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark), 6px 6px 0 rgba(0,0,0,.4);
    display:flex; flex-direction:column; }
  .titlebar{ height:28px; display:flex; align-items:center; gap:6px; padding:0 4px;
    background:linear-gradient(90deg, var(--title1), var(--title2)); color:#fff; cursor:move; flex:0 0 auto; }
  .window.inactive .titlebar{ background:linear-gradient(90deg,#6b6f73,#9aa0a6); }
  .titlebar .tt{ font-family:var(--pixel); font-weight:bold; font-size:13px; letter-spacing:.3px; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:1px 1px 0 rgba(0,0,0,.5); }
  .titlebar .tico{ font-size:15px; }
  .tbtn{ width:20px; height:17px; border:2px solid #000; background:var(--win);
    box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark);
    font-family:var(--pixel); font-weight:bold; font-size:11px; display:flex; align-items:center; justify-content:center; color:#000; line-height:1; }
  .tbtn:active{ box-shadow: inset -1px -1px 0 var(--win-light), inset 1px 1px 0 var(--win-dark); }
  .menubar{ display:flex; gap:14px; padding:3px 8px; font-size:14px; border-bottom:1px solid var(--win-dark); background:var(--win); color:#000; }
  .menubar u{ text-decoration:underline; }
  .wbody{ padding:14px; overflow:auto; background:var(--win); color:#101010; font-size:15px; line-height:1.4; max-height:62vh; }

  .wbody.flush{ padding:0; max-height:none; overflow:visible; }
  /* enquanto arrasta, o iframe não pode "engolir" o movimento do mouse */
  body.dragging iframe{ pointer-events:none; }

  /* ===== NAVEGADOR (Projetos.exe) ===== */
  .browser{ display:flex; flex-direction:column; }

  /* janela maximizada: cobre o desktop (menos a barra de tarefas) e o conteúdo estica junto.
     left/top/width inline continuam guardados, por isso restaurar volta pro lugar de antes. */
  .window.max{ left:0 !important; top:0 !important; width:100% !important; height:calc(100% - 38px); box-shadow:inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark); }
  .window.max .titlebar{ cursor:default; }
  .window.max .wbody{ width:auto !important; max-height:none; flex:1; min-height:0; display:flex; flex-direction:column; }
  .window.max .wbody > *{ flex:1; min-height:0; }
  .window.max .bview{ flex:1; min-height:0; display:flex; }
  .window.max .bview iframe{ flex:1; height:auto !important; }
  .btools{ display:flex; align-items:stretch; gap:2px; padding:3px 4px; border-bottom:1px solid var(--win-dark); box-shadow:0 1px 0 #fff; }
  .bbtn{ min-width:58px; padding:3px 6px 2px; border:1px solid transparent; background:none; color:#000; font-family:var(--mono); font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:1px; }
  .bbtn .bi{ font-size:18px; line-height:1; }
  .bbtn:not(:disabled):hover{ border-color:#fff var(--win-dark) var(--win-dark) #fff; }
  .bbtn:not(:disabled):active{ border-color:var(--win-dark) #fff #fff var(--win-dark); }
  .bbtn:disabled{ color:var(--win-dark); text-shadow:1px 1px 0 #fff; }
  .bsep{ width:2px; margin:2px 3px; border-left:1px solid var(--win-dark); border-right:1px solid #fff; }
  .throbber{ margin-left:auto; width:40px; height:40px; flex:0 0 auto; border:2px solid var(--win-dark); box-shadow:inset -1px -1px 0 #fff;
    background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .throbber::before{ content:""; position:absolute; left:50%; top:62%; width:24px; height:24px; translate:-50% -50%; border-radius:50%;
    background:repeating-linear-gradient(180deg, var(--yellow) 0 3px, var(--pink) 3px 4px); }
  .throbber::after{ content:"V"; position:relative; font-family:var(--display); font-style:italic; font-size:15px; color:var(--cyan); text-shadow:1px 1px 0 #000; top:-8px; }
  .browser.loading .throbber::before{ animation:throb .9s steps(6) infinite; }
  @keyframes throb{ from{ top:120%; } to{ top:30%; } }
  .baddr{ display:flex; align-items:center; gap:6px; padding:4px 6px; font-size:13px; color:#000; border-bottom:1px solid var(--win-dark); box-shadow:0 1px 0 #fff; }
  .baddr .field{ flex:1; display:flex; align-items:center; gap:5px; background:#fff; border:2px solid var(--win-dark);
    box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #dfdfdf; padding:2px 5px; font-family:var(--mono); font-size:13px; overflow:hidden; white-space:nowrap; }
  .bview{ margin:3px; border:2px solid var(--win-dark); box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #fff; padding:2px; background:#fff; }
  .bview iframe{ display:block; width:100%; border:0; background:#fff; }
  .bstatus{ display:flex; gap:3px; padding:0 3px 3px; font-size:12px; color:#000; }
  .bstatus > span{ border:1px solid; border-color:var(--win-dark) #fff #fff var(--win-dark); padding:2px 6px; white-space:nowrap; }
  .bstatus .msg{ flex:1; overflow:hidden; text-overflow:ellipsis; }
  .bstatus .prog{ width:120px; padding:2px; }
  .bstatus .prog i{ display:block; height:100%; min-height:10px; width:0;
    background:repeating-linear-gradient(90deg, var(--navy, #0a1fa0) 0 8px, transparent 8px 10px); }
  .browser.loading .prog i{ animation:prog 2.5s steps(12) forwards; }
  .browser.done .prog i{ width:100%; transition:width .15s; }
  @keyframes prog{ from{ width:0; } to{ width:90%; } }

  /* navegador compacto: mesmo visual, barras mais baixas pra sobrar espaço pro conteúdo */
  .window.compact .titlebar{ height:22px; gap:5px; }
  .window.compact .titlebar .tt{ font-size:12px; }
  .window.compact .titlebar .tico{ font-size:13px; }
  .window.compact .tbtn{ width:17px; height:14px; font-size:9px; }
  .window.compact .menubar{ padding:1px 8px; font-size:12px; gap:12px; }
  .window.compact .btools{ padding:2px 3px; }
  .window.compact .bbtn{ min-width:48px; padding:1px 5px 0; font-size:10px; gap:0; }
  .window.compact .bbtn .bi{ font-size:13px; }
  .window.compact .throbber{ width:28px; height:28px; }
  .window.compact .throbber::before{ width:17px; height:17px; }
  .window.compact .throbber::after{ font-size:11px; top:-6px; }
  .window.compact .baddr{ padding:2px 5px; font-size:11px; gap:5px; }
  .window.compact .baddr .field{ padding:0 5px; font-size:11px; }
  .window.compact .bview{ margin:2px 3px; }
  .window.compact .bstatus{ padding:0 3px 2px; font-size:10px; }
  .window.compact .bstatus > span{ padding:0 6px; }
  .window.compact .bstatus .prog{ width:100px; padding:2px; }
  .window.compact .bstatus .prog i{ min-height:8px; }

  .h-neon{ font-family:var(--display); font-style:italic; font-size:26px; line-height:1.05;
    background:linear-gradient(90deg,var(--pink),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:.5px; }
  .chip{ display:inline-block; background:var(--deep2); color:var(--cyan); border:1px solid var(--cyan); padding:1px 8px; margin:2px; font-size:13px; }
  .btn95{ display:inline-block; padding:5px 14px; background:var(--win); border:2px solid #000; color:#000; font-size:14px; text-decoration:none;
    box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark); }
  .btn95:active{ box-shadow: inset -1px -1px 0 var(--win-light), inset 1px 1px 0 var(--win-dark); }
  .inset{ border:2px solid var(--win-dark); box-shadow: inset 1px 1px 0 #6a6e72, inset -1px -1px 0 #fff; background:#fff; padding:10px; }
  .avatar{ display:block; flex:none; width:116px; height:143px; border:2px solid #000; object-fit:cover; object-position:center top;
    background:repeating-conic-gradient(var(--pink) 0 25%, var(--cyan) 0 50%) 0 0/22px 22px; }
  .counter{ display:inline-flex; gap:2px; }
  .counter b{ background:#000; color:#2cff6a; font-family:var(--mono); padding:2px 5px; border:1px solid #2cff6a; font-size:15px; }
  .ta{ width:100%; height:58px; font-family:var(--mono); font-size:14px; resize:none; }

  /* ===== TASKBAR ===== */
  #taskbar{ position:fixed; left:0; right:0; bottom:0; height:38px; z-index:5000; background:var(--win); border-top:2px solid #fff;
    display:flex; align-items:center; gap:6px; padding:4px; }
  #start{ display:flex; align-items:center; gap:7px; padding:3px 12px 3px 8px; font-family:var(--pixel); font-weight:bold; font-size:14px;
    border:2px solid #000; background:var(--win); color:#000; box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark); }
  #start.open, #start:active{ box-shadow: inset -1px -1px 0 var(--win-light), inset 1px 1px 0 var(--win-dark); }
  .taskitem{ max-width:170px; min-width:118px; height:28px; display:flex; align-items:center; gap:6px; padding:0 8px; font-size:13px;
    border:2px solid #000; background:var(--win); color:#000; overflow:hidden; white-space:nowrap;
    box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark); }
  .taskitem.active{ box-shadow: inset -1px -1px 0 var(--win-light), inset 1px 1px 0 var(--win-dark); background:#d9dcdf; }
  .taskitem .tl{ overflow:hidden; text-overflow:ellipsis; }
  /* botão de idioma (PT | EN), na bandeja ao lado do relógio: o idioma ativo fica "aceso" */
  #lang{ margin-left:auto; flex:none; display:flex; align-items:center; gap:2px; height:28px; padding:0 3px; font:bold 12px var(--pixel); color:#000;
    background:var(--win); border:2px solid #000; box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark); cursor:inherit; }
  #lang:active{ box-shadow: inset -1px -1px 0 var(--win-light), inset 1px 1px 0 var(--win-dark); }
  #lang span{ padding:1px 5px; color:#555; }
  #lang span.on{ color:#fff; background:#0a1fa0; }
  #lang i{ font-style:normal; color:var(--win-dark); }
  #clock{ flex:none; border:2px solid var(--win-dark); box-shadow: inset 1px 1px 0 #6a6e72, inset -1px -1px 0 #fff; padding:5px 12px; font-size:14px; color:#000; }

  #startmenu{ position:fixed; left:4px; bottom:40px; width:226px; z-index:6000; background:var(--win); border:2px solid #000;
    box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark), 5px 5px 0 rgba(0,0,0,.4); display:none; }
  #startmenu.open{ display:flex; }
  #startmenu .side{ width:28px; background:linear-gradient(var(--title1),var(--title2)); writing-mode:vertical-rl; transform:rotate(180deg);
    color:#fff; font-family:var(--display); font-style:italic; font-size:14px; text-align:center; padding:10px 0; letter-spacing:1px; }
  #startmenu .items{ flex:1; padding:4px; }
  .mi{ padding:8px 10px; font-size:15px; color:#000; display:flex; gap:10px; align-items:center; }
  .mi:hover{ background:#0a1fa0; color:#fff; }
  .sep{ height:2px; background:var(--win-dark); margin:3px 0; box-shadow:0 1px 0 #fff; }

  .hint{ position:fixed; z-index:5; bottom:46px; right:12px; color:#fff; font-size:13px; text-shadow:1px 1px 0 #000; opacity:.85; }
  a{ color:#0a1fa0; }
</style>
</head>
<body>
  <div id="bg">
    <div id="sun"></div>
    <div id="mtns"></div>
    <div id="grid"></div>
    <div class="cloud" style="top:7%; font-size:30px; animation-duration:48s">☁</div>
    <div class="cloud" style="top:18%; font-size:22px; animation-duration:64s; animation-delay:-20s">☁</div>
    <div class="cloud" style="top:4%; font-size:40px; animation-duration:76s; animation-delay:-45s">☁</div>
  </div>

  <div id="desktop"></div>

  <div id="crt"></div>

  <div id="boot" title="Clique para pular" data-en-title="Click to skip">
    <div class="splash">
      <div class="bcloud" style="left:-8%; top:6%;  width:46vw; height:20vh;"></div>
      <div class="bcloud" style="left:48%; top:2%;  width:52vw; height:24vh; animation-duration:38s; animation-direction:reverse;"></div>
      <div class="bcloud" style="left:12%; top:58%; width:40vw; height:18vh; animation-duration:34s;"></div>
      <div class="bcloud" style="left:62%; top:52%; width:44vw; height:22vh; animation-duration:42s; animation-direction:reverse;"></div>
      <div class="bcloud" style="left:30%; top:76%; width:50vw; height:16vh; animation-duration:46s;"></div>

      <div class="logo">
        <!-- computador anos 90: monitor CRT com pôr do sol vaporwave, gabinete, teclado e mouse -->
        <svg class="pc" viewBox="0 0 220 220" aria-hidden="true">
          <defs>
            <linearGradient id="pc-beige" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4eedf"/><stop offset=".55" stop-color="#e0d7c0"/><stop offset="1" stop-color="#c8bea4"/>
            </linearGradient>
            <linearGradient id="pc-recess" x1="0" y1="0" x2="0" y2="1">

/* =================== HELPERS DOM =================== */
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if(props) for(const k in props){
    if(k==="class") n.className = props[k];
    else if(k==="html") n.innerHTML = props[k];
    else if(k==="style") n.setAttribute("style", props[k]);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else n.setAttribute(k, props[k]);
  }
  for(const c of kids){ if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;
}

  return root;

/* Navegador anos 90: barra de ferramentas, endereço, iframe com a página de projetos e barra de status.
   O histórico (Voltar/Avançar) é próprio, pra nunca mexer no histórico da página principal. */
function browserBody(){
  const HOME = new URL(PROJECTS_PAGE, location.href).href;
  const BASE = new URL(".", HOME).href;
  const hist = [HOME]; let idx = 0, navigating = false;

  const frame = el("iframe",{title:t("Projetos","Projects"), src:HOME});
  // as barras do navegador são compactas (classe .compact), então sobra mais altura pro conteúdo
  frame.style.height = Math.max(240, Math.min(560, innerHeight - 232)) + "px";
  const addr = el("span",null, FAKE_HOST);
  const msg = el("span",{class:"msg"}, t("Abrindo página...","Opening page..."));
  const rotulos = [];   // [nó de texto, pt, en] dos botões, pra trocar o idioma sem recarregar a página aberta
  const btn = (icon, pt, en, fn)=>{
    const txt = document.createTextNode(t(pt, en));
    rotulos.push([txt, pt, en]);
    return el("button",{class:"bbtn", onclick:fn}, el("span",{class:"bi"}, icon), txt);
  };
  const bBack = btn("◀","Voltar","Back", ()=>go(idx-1));
  const bFwd  = btn("▶","Avançar","Forward", ()=>go(idx+1));
  const bStop = btn("✖","Parar","Stop", ()=>{ try{ frame.contentWindow.stop(); }catch(e){} setDone(t("Interrompido.","Stopped.")); });
  const bReload = btn("↻","Atualizar","Refresh", ()=>{ setLoading(); try{ frame.contentWindow.location.reload(); }catch(e){ frame.src = hist[idx]; } });
  const bHome = btn("⌂","Início","Home", ()=>{ hist.splice(idx+1); if(hist[idx]!==HOME){ hist.push(HOME); idx++; } go(idx); });
  const addrLabel = document.createTextNode(t("Endereço","Address"));
  rotulos.push([addrLabel, "Endereço", "Address"]);

  const root = el("div",{class:"browser loading"},
    el("div",{class:"btools"}, bBack, bFwd, bStop, bReload, el("div",{class:"bsep"}), bHome, el("div",{class:"throbber",title:"VaporWeb"})),
    el("div",{class:"baddr"}, addrLabel, el("div",{class:"field"}, el("span",null,"🌐"), addr)),
    el("div",{class:"bview"}, frame),
    el("div",{class:"bstatus"}, msg, el("span",{class:"prog"}, el("i")), el("span",null,"🌐 Internet")));
  let doneMsg = null;   // [pt, en] da última mensagem de status, pra traduzir também
  root.relabel = ()=>{
    rotulos.forEach(([n, pt, en])=> n.textContent = t(pt, en));
    frame.title = t("Projetos","Projects");
    if(doneMsg) msg.textContent = tr(doneMsg);
    // a página aberta no iframe troca de idioma sem recarregar (funciona até em file://)
    try{ frame.contentWindow.postMessage({ type:"brennoos-lang", lang:I18N.lang }, "*"); }catch(e){}
  };

  function fake(url){
    const clean = url.split("#")[0].split("?")[0];
    return clean.startsWith(BASE) ? FAKE_HOST + clean.slice(BASE.length).replace(/index\.html$/,"") : url;
  }
  function syncButtons(){ bBack.disabled = idx<=0; bFwd.disabled = idx>=hist.length-1; }
  function setLoading(){ doneMsg = null; root.classList.remove("done"); root.classList.add("loading"); msg.textContent = t("Abrindo página ","Opening page ")+fake(hist[idx])+"..."; }
  function setDone(text){ root.classList.remove("loading"); root.classList.add("done"); msg.textContent = text;
    doneMsg = text===t("Concluído","Done") ? ["Concluído","Done"] : text===t("Interrompido.","Stopped.") ? ["Interrompido.","Stopped."] : null; }
  function go(i){
    if(i<0 || i>=hist.length) return;
    idx = i; navigating = true; setLoading(); syncButtons();
    try{ frame.contentWindow.location.replace(hist[idx]); }catch(e){ frame.src = hist[idx]; }
  }

  frame.addEventListener("load", ()=>{
    // em http(s) dá pra ler a URL do iframe; abrindo via file:// o navegador bloqueia, aí mantemos a última conhecida
    let url = null; try{ url = frame.contentWindow.location.href; }catch(e){}
    if(url && url!=="about:blank" && !navigating && url!==hist[idx]){ hist.splice(idx+1); hist.push(url); idx = hist.length-1; }
    navigating = false;
    addr.textContent = fake(url || hist[idx]);
    syncButtons(); setDone(t("Concluído","Done"));
    // garante que a página nova abre no idioma do desktop, mesmo se o navegador não compartilhar o localStorage
    try{ frame.contentWindow.postMessage({ type:"brennoos-lang", lang:I18N.lang }, "*"); }catch(e){}
  });
  syncButtons();
  return root;
}

  const btns = el("div",{style:"margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"});
  ICONS.forEach(ic=> btns.append(el("a",{class:"btn95",href:"#",onclick:e=>{e.preventDefault(); openWindow(ic.spec());}}, ic.glyph+" "+ic.label().replace("_"," "))));
  return el("div",{style:"text-align:center"},
    el("div",{class:"h-neon",style:"font-size:28px"}, "BRENNO//OS"),
    el("div",{style:"margin-top:4px"}, t("Sistema iniciado com sucesso ✓","System started successfully ✓")),
    el("div",{class:"inset",style:"margin-top:12px;text-align:left",html: t(
      "Olá! Isto é um <b>spike</b> — um protótipo pra sentir a ideia.<br>Dê <b>dois cliques</b> nos ícones da esquerda (ou use o <b>Iniciar</b>) pra abrir as janelas. Arraste pelas barras de título. Minimize na barra de tarefas.",
      "Hi! This is a <b>spike</b>, a prototype to get a feel for the idea.<br><b>Double-click</b> the icons on the left (or use <b>Start</b>) to open the windows. Drag them by the title bars. Minimize them to the taskbar.")}),
    btns);
}

/* =================== ESPECIFICAÇÕES DE JANELA =================== */
/* rótulos e títulos são funções: assim leem o idioma ativo toda vez */
const ICONS = [
  { key:"about",   glyph:"👤", label:()=>t("Sobre_mim","About_me"), spec:()=>({ key:"about", icon:"👤", title:t("Sobre mim","About me"), width:430, render:aboutBody }) },
  { key:"proj",    glyph:"🌐", label:()=>t("Projetos.exe","Projects.exe"), spec:()=>({ key:"proj", icon:"🌐", title:t("Projetos - VaporWeb Navegador","Projects - VaporWeb Browser"), width:820, maximizable:true,
      flush:true, cls:"compact", menu:t(["Arquivo","Editar","Ver","Favoritos","Ajuda"],["File","Edit","View","Favorites","Help"]), render:browserBody }) },
  { key:"skills",  glyph:"💾", label:()=>"Skills", spec:()=>({ key:"skills", icon:"💾", title:"Skills.exe", width:360, render:skillsBody }) },
  { key:"contact", glyph:"✉",  label:()=>t("Contato","Contact"), spec:()=>({ key:"contact", icon:"✉", title:t("Contato","Contact"), width:370, render:contactBody }) },
  { key:"cv",      glyph:"📄", label:()=>t("Curriculo","Resume"), spec:()=>({ key:"cv", icon:"📄", title:t("curriculo.pdf","resume.pdf"), width:340, render:cvBody }) },
];
const WELCOME = ()=>({ key:"welcome", icon:"🖥", title:t("Bem-vindo.txt","Welcome.txt"), width:440, render:welcomeBody });
const specFor = key => key==="welcome" ? WELCOME() : ICONS.find(ic=> ic.key===key).spec();

/* =================== WINDOW MANAGER =================== */
const desktop = document.getElementById("desktop");
const state = { wins:[], z:10, active:null };
let taskbarEl, startMenuEl;

function focusWin(w){
  state.active = w.id;
  w.min = false; w.el.style.display = "flex";
  w.el.style.zIndex = (++state.z);
  state.wins.forEach(x=> x.el.classList.toggle("inactive", x!==w));
  renderTaskbar();
}
function openWindow(spec){
  const existing = state.wins.find(x=> x.key===spec.key);
  if(existing){ focusWin(existing); return existing; }
  const id = "win"+Math.random().toString(36).slice(2,7);
  const w = { id, key:spec.key, icon:spec.icon, title:spec.title, min:false, max:false };

  w.tt = el("span",{class:"tt"}, spec.title);
  w.minBtn = el("button",{class:"tbtn", title:t("Minimizar","Minimize"), onclick:(e)=>{e.stopPropagation(); minimize(w);} }, "_");
  w.closeBtn = el("button",{class:"tbtn", title:t("Fechar","Close"), onclick:(e)=>{e.stopPropagation(); closeWin(w);} }, "✕");
  const titlebar = el("div",{class:"titlebar"},
    el("span",{class:"tico"}, spec.icon),
    w.tt, w.minBtn,
    spec.maximizable ? (w.maxBtn = el("button",{class:"tbtn", title:t("Maximizar","Maximize"), onclick:(e)=>{e.stopPropagation(); toggleMax(w);} }, "□")) : null,
    w.closeBtn);
  // janelas grandes (ex.: navegador) encolhem pra caber na tela
  const width = Math.min(spec.width||320, innerWidth-16);
  const body = el("div",{class:"wbody"+(spec.flush?" flush":""),style:"width:"+width+"px"});
  body.append(spec.render());
  // menu com a primeira letra sublinhada (Arquivo, Editar...)
  const menu = el("div",{class:"menubar"});
  w.body = body; w.menu = menu;
  fillMenu(menu, spec);
  const node = el("div",{class:"window"+(spec.cls?" "+spec.cls:""), style:"width:"+width+"px"},
    titlebar, menu, body);
  node.addEventListener("mousedown", ()=>focusWin(w));
  makeDraggable(node, titlebar, w);
  // duplo clique na barra de título: maximiza (se puder) ou minimiza
  titlebar.addEventListener("dblclick", (e)=>{ if(e.target.closest(".tbtn")) return; spec.maximizable ? toggleMax(w) : minimize(w); });
  w.el = node;
  desktop.append(node);
  // toda janela abre centralizada na área livre (acima da barra de tarefas), já com a altura real dela
  node.style.left = Math.max(0, Math.round((innerWidth - node.offsetWidth)/2)) + "px";
  node.style.top  = Math.max(0, Math.round((innerHeight - 38 - node.offsetHeight)/2)) + "px";
  state.wins.push(w);
  focusWin(w);
  renderTaskbar();
  return w;
}
function fillMenu(menu, spec){
  menu.replaceChildren();
  (spec.menu || t(["Arquivo","Editar","Ver","Ajuda"],["File","Edit","View","Help"])).forEach(m=> menu.append(el("span",null, el("u",null,m[0]), m.slice(1))));
}
/* troca o idioma de uma janela aberta, no lugar: mesma posição, mesmo tamanho.
   O navegador (Projetos.exe) não é redesenhado, senão a página aberta recarregaria. */
function relabelWin(w){
  const spec = specFor(w.key);
  w.title = spec.title; w.tt.textContent = spec.title;
  w.minBtn.title = t("Minimizar","Minimize"); w.closeBtn.title = t("Fechar","Close");
  if(w.maxBtn) w.maxBtn.title = w.max ? t("Restaurar","Restore") : t("Maximizar","Maximize");
  fillMenu(w.menu, spec);
  if(w.key==="proj") w.body.firstChild.relabel();
  else { const scroll = w.body.scrollTop; w.body.replaceChildren(spec.render()); w.body.scrollTop = scroll; }
}
function closeWin(w){ w.el.remove(); state.wins = state.wins.filter(x=>x!==w); if(state.active===w.id) state.active=null; renderTaskbar(); }
function minimize(w){ w.min=true; w.el.style.display="none"; if(state.active===w.id) state.active=null;
  state.wins.forEach(x=>x.el.classList.add("inactive")); renderTaskbar(); }
function toggleTask(w){ if(state.active===w.id && !w.min){ minimize(w); } else { focusWin(w); } }
/* tela cheia: a janela ocupa todo o desktop acima da barra de tarefas; a posição antiga volta ao restaurar */
function toggleMax(w){
  w.max = !w.max;
  w.el.classList.toggle("max", w.max);
  w.maxBtn.textContent = w.max ? "❐" : "□";
  w.maxBtn.title = w.max ? t("Restaurar","Restore") : t("Maximizar","Maximize");
  focusWin(w);
}

function makeDraggable(node, handle, w){
  handle.addEventListener("mousedown", (e)=>{
    if(e.target.classList.contains("tbtn")) return;
    e.preventDefault(); focusWin(w);
    if(w.max) return;   // maximizada não arrasta
    const r = node.getBoundingClientRect();
    const sx=e.clientX, sy=e.clientY, ox=r.left, oy=r.top;
    document.body.classList.add("dragging");
    const move=(ev)=>{ node.style.left = Math.max(0, ox+(ev.clientX-sx))+"px";
                       node.style.top  = Math.max(0, oy+(ev.clientY-sy))+"px"; };
    const up=()=>{ document.body.classList.remove("dragging");
                   document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); };
    document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
  });
}
/* clique dentro de um iframe não dispara mousedown aqui fora: detecta pelo foco e traz a janela pra frente */
addEventListener("blur", ()=> setTimeout(()=>{
  const f = document.activeElement;
  if(f && f.tagName==="IFRAME"){ const w = state.wins.find(x=> x.el.contains(f)); if(w && state.active!==w.id) focusWin(w); }
}));

/* =================== TASKBAR / START =================== */
function fillStartMenu(){
  const items = el("div",{class:"items"});
  ICONS.forEach(ic=> items.append(el("div",{class:"mi", onclick:()=>{ openWindow(ic.spec()); toggleStart(false); }}, el("span",null,ic.glyph), ic.label().replace("_"," "))));
  items.append(el("div",{class:"sep"}));
  items.append(el("div",{class:"mi", onclick:()=>location.reload()}, el("span",null,"🔌"), t("Reiniciar","Restart")));
  startMenuEl.replaceChildren(el("div",{class:"side"},"BRENNO//OS"), items);
}
let startLabel, langBtn, clockEl;
function tickClock(){
  // 24h nos dois idiomas, como no resto do sistema; só o formato regional muda
  clockEl.textContent = "🕐 "+new Date().toLocaleTimeString(I18N.lang==="en" ? "en-GB" : "pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function paintLangBtn(){
  const en = I18N.lang==="en";
  langBtn.replaceChildren(el("span",en?null:{class:"on"},"PT"), el("i",null,"|"), el("span",en?{class:"on"}:null,"EN"));
  langBtn.title = en ? "Mudar para português" : "Switch to English";
  langBtn.setAttribute("aria-label", langBtn.title);
}
/* troca o idioma do desktop inteiro sem recarregar: ícones, menu, barra, janelas abertas e a página do navegador */
function setLang(lang){
  I18N.set(lang);
  fillStartMenu();
  startLabel.textContent = t("Iniciar","Start");
  paintLangBtn(); tickClock();
  icons.forEach(ic=> ic.labelEl.textContent = ICONS.find(d=> d.key===ic.key).label());
  hintEl.textContent = hintText();
  state.wins.forEach(relabelWin);
  renderTaskbar();
}
function buildChrome(){
  startMenuEl = el("div",{id:"startmenu"});
  fillStartMenu();
  document.body.append(startMenuEl);

  startLabel = document.createTextNode(t("Iniciar","Start"));
  const startBtn = el("button",{id:"start", onclick:(e)=>{ e.stopPropagation(); toggleStart(); }}, el("span",{style:"font-size:15px"},"🪟"), startLabel);
  const tasks = el("div",{id:"tasks",style:"display:flex;gap:6px;overflow:hidden"});
  langBtn = el("button",{id:"lang", type:"button", onclick:()=> setLang(I18N.lang==="en" ? "pt" : "en")});
  paintLangBtn();
  clockEl = el("div",{id:"clock"},"🕐 --:--");
  taskbarEl = el("div",{id:"taskbar", onmousedown:e=>e.stopPropagation()}, startBtn, tasks, langBtn, clockEl);
  document.body.append(taskbarEl);

  setInterval(tickClock, 1000);
  tickClock();
}
function renderTaskbar(){
  const tasks = document.getElementById("tasks"); if(!tasks) return;
  tasks.innerHTML="";
  state.wins.forEach(w=>{
    tasks.append(el("button",{class:"taskitem"+((state.active===w.id&&!w.min)?" active":""), onclick:()=>toggleTask(w)},
      el("span",null,w.icon), el("span",{class:"tl"}, w.title)));
  });
}
function toggleStart(force){
  const open = force===undefined ? !startMenuEl.classList.contains("open") : force;
  startMenuEl.classList.toggle("open", open);
  document.getElementById("start").classList.toggle("open", open);
}

/* =================== DESKTOP ICONS =================== */
/* Os ícones moram numa grade invisível, como no Windows com "alinhar ícones à grade":
   durante o arraste o ícone segue o mouse; ao soltar, encaixa na célula mais próxima
   (ou na livre mais perto, se ela estiver ocupada). A célula de cada ícone fica salva
   no navegador, então a arrumação do visitante continua na próxima visita. */
const ICON_CELLS_KEY = "brennoos.iconCells";
const OLD_ICON_POS_KEY = "brennoos.iconPos";          // versão antiga: posições livres em px
const ICON_W = 108, ICON_H = 84, TASKBAR_H = 38;
const GRID = { x0:4, y0:10, w:112, h:90 };            // origem e tamanho de cada célula
const icons = [];                                      // { key, node, cell:[coluna, linha] }
let iconSlot, hintEl;
const hintText = ()=> t("spike • arraste as janelas e os ícones • dois cliques nos ícones", "spike • drag the windows and icons • double-click the icons");

const cellKey = c => c[0] + "," + c[1];
function gridSize(){
  return { cols: Math.max(1, Math.floor((innerWidth - GRID.x0) / GRID.w)),
           rows: Math.max(1, Math.floor((innerHeight - TASKBAR_H - GRID.y0) / GRID.h)) };
}
function clampCell([c, r]){
  const { cols, rows } = gridSize();
  return [Math.max(0, Math.min(c, cols - 1)), Math.max(0, Math.min(r, rows - 1))];
}
const cellToPx = ([c, r]) => [GRID.x0 + c * GRID.w + (GRID.w - ICON_W) / 2, GRID.y0 + r * GRID.h];
const pxToCell = (x, y) => clampCell([Math.round((x - GRID.x0 - (GRID.w - ICON_W) / 2) / GRID.w), Math.round((y - GRID.y0) / GRID.h)]);
/* célula livre mais perto de `alvo`; no empate, a que vem antes de cima pra baixo, coluna por coluna (como o Windows enche a área de trabalho) */
function freeCellNear(alvo, ocupadas){
  const { cols, rows } = gridSize();
  let melhor = null, menor = Infinity;
  for(let c = 0; c < cols; c++) for(let r = 0; r < rows; r++){
    if(ocupadas.has(cellKey([c, r]))) continue;
    const d = (c - alvo[0]) ** 2 + (r - alvo[1]) ** 2;
    if(d < menor){ menor = d; melhor = [c, r]; }
  }
  return melhor || alvo;                               // tela lotada: empilha (não deve acontecer com poucos ícones)
}
function setIconCell(ic, cell){
  ic.cell = cell;
  const [x, y] = cellToPx(cell);
  ic.node.style.left = x + "px"; ic.node.style.top = y + "px";
}

function loadIconCells(){
  try{
    const salvo = JSON.parse(localStorage.getItem(ICON_CELLS_KEY));
    if(salvo) return salvo;
    // quem já arrumou os ícones na versão antiga (px livres) não perde a arrumação: vira a célula mais próxima
    const antigo = JSON.parse(localStorage.getItem(OLD_ICON_POS_KEY));
    if(antigo){
      const cells = {};
      for(const k in antigo) cells[k] = pxToCell(antigo[k][0], antigo[k][1]);
      return cells;
    }
  }catch(e){}
  return {};
}
function saveIconCells(){
  const cells = {};
  icons.forEach(ic => cells[ic.key] = ic.cell);
  try{ localStorage.setItem(ICON_CELLS_KEY, JSON.stringify(cells)); localStorage.removeItem(OLD_ICON_POS_KEY); }catch(e){}
}
/* põe cada ícone na sua célula; se a tela encolheu e duas caíram no mesmo lugar, a segunda vai pra livre mais perto */
function layoutIcons(preferidas){
  const ocupadas = new Set();
  icons.forEach((ic, i) => {
    const quer = clampCell(preferidas[ic.key] || [0, i]);   // padrão: uma coluna à esquerda
    const cell = ocupadas.has(cellKey(quer)) ? freeCellNear(quer, ocupadas) : quer;
    ocupadas.add(cellKey(cell));
    setIconCell(ic, cell);
  });
}

function buildIcons(){
  const wrap = el("div",{class:"icons"});
  iconSlot = el("div",{class:"icon-slot"});
  wrap.append(iconSlot);
  ICONS.forEach(def=>{
    const labelEl = el("div",{class:"label"}, def.label());
    const node = el("div",{class:"icon"}, el("div",{class:"glyph"}, def.glyph), labelEl);
    const ic = { key:def.key, node, labelEl, cell:null };
    icons.push(ic);
    node.addEventListener("dblclick", ()=> openWindow(def.spec()));
    makeIconDraggable(ic);
    wrap.append(node);
  });
  let preferidas = loadIconCells();
  layoutIcons(preferidas);
  desktop.append(wrap);
  hintEl = el("div",{class:"hint"}, hintText());
  desktop.append(hintEl);

  // ao redimensionar, reacomoda a partir das células salvas (se a tela voltar a crescer, os ícones voltam pro lugar)
  addEventListener("resize", ()=> layoutIcons(preferidas));
  // depois de cada arraste, o que está na tela vira a nova preferência
  wrap.addEventListener("iconsmoved", ()=>{ preferidas = Object.fromEntries(icons.map(ic => [ic.key, ic.cell])); });
}
function makeIconDraggable(ic){
  const node = ic.node;
  node.addEventListener("pointerdown", e=>{
    if(e.button!==0) return;
    e.stopPropagation(); e.preventDefault();
    toggleStart(false);
    document.querySelectorAll(".icon").forEach(n=>n.classList.remove("sel"));
    node.classList.add("sel");

    const sx=e.clientX, sy=e.clientY, ox=node.offsetLeft, oy=node.offsetTop;
    const ocupadas = new Set(icons.filter(o => o !== ic).map(o => cellKey(o.cell)));
    let moved = false, destino = ic.cell;
    try{ node.setPointerCapture(e.pointerId); }catch(err){}
    const move = ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved && Math.hypot(dx,dy) < 4) return;        // só vira arraste depois de mexer uns pixels (não atrapalha o duplo clique)
      if(!moved){ moved = true; node.classList.add("moving"); document.body.classList.add("dragging"); iconSlot.classList.add("on"); }
      // segue o mouse sem sair da tela
      const x = Math.max(0, Math.min(ox+dx, innerWidth - ICON_W));
      const y = Math.max(0, Math.min(oy+dy, innerHeight - TASKBAR_H - ICON_H));
      node.style.left = x+"px"; node.style.top = y+"px";
      // mostra onde ele vai cair
      const alvo = pxToCell(x, y);
      destino = ocupadas.has(cellKey(alvo)) ? freeCellNear(alvo, ocupadas) : alvo;
      const [cx, cy] = cellToPx(destino);
      iconSlot.style.left = cx+"px"; iconSlot.style.top = cy+"px";
    };
    const up = ()=>{
      node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); node.removeEventListener("pointercancel", up);
      if(!moved) return;
      node.classList.remove("moving"); document.body.classList.remove("dragging"); iconSlot.classList.remove("on");
      setIconCell(ic, destino);                            // encaixa (a transição do CSS faz o "clique" visual)
      saveIconCells();
      node.parentNode.dispatchEvent(new Event("iconsmoved"));
    };
    node.addEventListener("pointermove", move); node.addEventListener("pointerup", up); node.addEventListener("pointercancel", up);
  });
}

/* fecha menu / deseleciona ao clicar no vazio */
document.addEventListener("mousedown", ()=>{ toggleStart(false); document.querySelectorAll(".icon").forEach(n=>n.classList.remove("sel")); });

/* =================== BOOT =================== */
function startOS(){
  buildIcons(); buildChrome();
  openWindow(WELCOME());
}
/* sequência: monitor liga (flash) → splash com céu e logo → some e mostra o desktop.
   Clique ou qualquer tecla pula a animação. */
function runBoot(){
  const boot = document.getElementById("boot");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SPLASH_MS = reduced ? 900 : 2400;
  const timers = [];
  let done = false;

  function finish(){
    if(done) return; done = true;
    timers.forEach(clearTimeout);
    removeEventListener("keydown", finish);
    startOS();
    boot.classList.add("off");
    setTimeout(()=> boot.style.display="none", 450);
  }

  boot.classList.add("power");
  timers.push(setTimeout(()=> boot.classList.add("on"), reduced ? 0 : 280));
  timers.push(setTimeout(finish, SPLASH_MS));
  boot.addEventListener("mousedown", e=>{ e.stopPropagation(); finish(); });
  addEventListener("keydown", finish);
}
window.addEventListener("DOMContentLoaded", runBoot);
